name: Build Android APKs

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Release APKs
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Customer Loyalty Pass APK
        uses: actions/upload-artifact@v4
        with:
          name: LoyaltyPass-Customer.apk
          path: android/app/build/outputs/apk/customer/release/*.apk
          retention-days: 14

      - name: Upload Store Owner Terminal APK
        uses: actions/upload-artifact@v4
        with:
          name: StoreTerminal-Owner.apk
          path: android/app/build/outputs/apk/owner/release/*.apk
          retention-days: 14
